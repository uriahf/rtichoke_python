name: Apply LOWESS migration

on:
  push:
    branches: [agent/remove-statsmodels-lowess]
    paths:
      - '.maintenance/replace_statsmodels_lowess.py'
      - '.github/workflows/apply-lowess-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-statsmodels-lowess
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python .maintenance/replace_statsmodels_lowess.py
      - name: Remove migration helpers
        run: rm -rf .maintenance .github/workflows/apply-lowess-migration.yml
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use smoothstate LOWESS and drop statsmodels'
          git push
