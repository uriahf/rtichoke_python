name: Polars count cleanup

on:
  push:
    branches:
      - modernize/polars-count

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/polars-count
      - name: Replace deprecated Polars count
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/rtichoke/processing/adjustments.py')
          text = path.read_text()
          count = text.count('pl.count()')
          if count != 2:
              raise SystemExit(f'expected 2 pl.count() calls, found {count}')
          path.write_text(text.replace('pl.count()', 'pl.len()'))
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/rtichoke/processing/adjustments.py
          git commit -m "Replace deprecated Polars count"
          git push
# trigger
