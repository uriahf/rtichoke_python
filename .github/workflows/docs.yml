name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project and docs dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install great-docs

      - name: Build documentation
        run: uv run great-docs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: great-docs/_site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built docs
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: preview-artifact

      - name: Extract Pages artifact
        run: |
          mkdir preview-site
          tar -xf preview-artifact/artifact.tar -C preview-site

      - name: Publish PR preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtichoke-docs-preview-pr-${{ github.event.pull_request.number }}
          path: preview-site
          retention-days: 14

      - name: Preview instructions
        run: |
          echo "Rendered documentation is available as the workflow artifact: rtichoke-docs-preview-pr-${{ github.event.pull_request.number }}"
