name: Summary report preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'src/rtichoke/summary_report/**'
      - 'examples/summary_report_demo.py'
      - 'tests/test_calibration_renderer_asset.py'
      - '.github/workflows/summary-report-preview.yml'

permissions:
  contents: write

concurrency:
  group: summary-report-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: uv sync

      - name: Generate summary report demo
        run: |
          uv run python examples/summary_report_demo.py
          test -s summary-report-demo.html

      - name: Publish standalone report preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          cd /tmp/gh-pages

          # Keep this outside pr-preview/, which is owned by the documentation
          # preview deployment and may be replaced wholesale on every docs run.
          DEST="report-preview/pr-${PR_NUMBER}"
          mkdir -p "$DEST"
          cp "${GITHUB_WORKSPACE}/summary-report-demo.html" "$DEST/index.html"
          touch .nojekyll
          git add .nojekyll "$DEST/index.html"
          if ! git diff --cached --quiet; then
            git commit -m "Update summary report preview for PR #${PR_NUMBER}"
            # Documentation may update gh-pages concurrently. Rebase once so
            # this small standalone preview does not overwrite those changes.
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi

          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${DEST}/"
          echo "### Summary report preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published file exists on gh-pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git cat-file -e "origin/gh-pages:report-preview/pr-${PR_NUMBER}/index.html"
          echo "Verified report-preview/pr-${PR_NUMBER}/index.html on gh-pages"

      - name: Upload fallback artifact
        uses: actions/upload-artifact@v4
        with:
          name: summary-report-preview-pr-${{ github.event.pull_request.number }}
          path: summary-report-demo.html
          if-no-files-found: error
          retention-days: 7
