name: Refresh release lockfile

on:
  push:
    branches: [chore/sync-lock-0.1.36]
    paths:
      - .github/workflows/refresh-lock-temp.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/sync-lock-0.1.36
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Refresh lockfile
        run: uv lock
      - name: Verify scope
        shell: bash
        run: |
          changed=$(git diff --name-only)
          test "$changed" = "uv.lock"
          git diff -- uv.lock
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Refresh lockfile for 0.1.36"
          git push origin HEAD:chore/sync-lock-0.1.36
