name: Refresh Plotly 6 lockfile

on:
  push:
    branches:
      - modernize/refresh-lock-plotly6

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/refresh-lock-plotly6
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv lock
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- uv.lock
          git commit -m "Refresh lockfile for Plotly 6"
          git push
