name: Format viz proof

on:
  push:
    branches:
      - integration/vendor-rtichoke-viz-roc
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/vendor-rtichoke-viz-roc
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --dev
      - run: uv run ruff format src/rtichoke/_viz_browser.py tests/test_viz_browser.py examples/rtichoke_viz_roc.py
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/rtichoke/_viz_browser.py tests/test_viz_browser.py examples/rtichoke_viz_roc.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format rtichoke_viz proof"
          git push origin HEAD:integration/vendor-rtichoke-viz-roc
