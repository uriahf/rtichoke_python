name: Vendor rtichoke_viz proof assets

on:
  push:
    branches:
      - integration/vendor-rtichoke-viz-roc
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/vendor-rtichoke-viz-roc
      - uses: actions/checkout@v4
        with:
          repository: uriahf/rtichoke_viz
          ref: 926ec882dfe48a13359d705817ec2d0388649253
          path: .tmp/rtichoke_viz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build browser bundle
        working-directory: .tmp/rtichoke_viz
        run: |
          npm install
          npm run build
      - name: Copy compiled asset into the Python package
        run: |
          mkdir -p src/rtichoke/_vendor/rtichoke_viz
          cp .tmp/rtichoke_viz/dist/rtichoke-viz.js src/rtichoke/_vendor/rtichoke_viz/rtichoke-viz.js
          cat > src/rtichoke/_vendor/rtichoke_viz/rtichoke-viz.css <<'CSS'
          .rtichoke-viz-chart {
            overflow-x: auto;
            min-height: 600px;
          }
          .rtichoke-viz-chart > * {
            display: block;
          }
          CSS
          cat > src/rtichoke/_vendor/rtichoke_viz/VENDORED_FROM <<'META'
          repository=https://github.com/uriahf/rtichoke_viz
          commit=926ec882dfe48a13359d705817ec2d0388649253
          META
      - name: Commit vendored assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/rtichoke/_vendor/rtichoke_viz/rtichoke-viz.js src/rtichoke/_vendor/rtichoke_viz/rtichoke-viz.css src/rtichoke/_vendor/rtichoke_viz/VENDORED_FROM
          git commit -m "Vendor compiled rtichoke_viz browser assets"
          git push origin HEAD:integration/vendor-rtichoke-viz-roc
