name: Patch calibration adjusted no censoring

on:
  push:
    branches: ["agent/calibration-adjusted-no-censoring"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calibration-adjusted-no-censoring
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - name: Apply focused patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Run focused tests
        run: uv run pytest tests/test_calibration_times.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rtichoke/calibration/calibration.py tests/test_calibration_times.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Allow adjusted calibration when censoring is absent"
          git push origin HEAD:agent/calibration-adjusted-no-censoring
