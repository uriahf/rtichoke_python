name: Temporary Decision Curve check

on:
  push:
    branches:
      - feat/static-decision-curve-browser
    paths:
      - .github/workflows/_temporary-decision-curve-check.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/static-decision-curve-browser
      - uses: astral-sh/setup-uv@v6
      - name: Add Decision Curve browser export dispatch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/rtichoke/_renderers.py')
          text = path.read_text()
          old = '            "lift": "renderLiftV2",\n'
          new = old + '            "decision_curve": "renderDecisionCurveV2",\n'
          if '"decision_curve": "renderDecisionCurveV2"' not in text:
              if old not in text:
                  raise SystemExit('renderer dispatch anchor missing')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Run focused checks
        shell: bash
        run: |
          set -euo pipefail
          uv sync
          uv run ruff check src/rtichoke/_decision_curve_viz_spec_v2.py src/rtichoke/utility/decision.py src/rtichoke/_renderers.py tests/test_decision_curve_v2.py tests/test_rtichoke_viz_vendor.py
          uv run pytest -q tests/test_decision_curve_v2.py tests/test_rtichoke_viz_vendor.py tests/test_cutoff_boundary_semantics.py tests/test_interventions_avoided_scaling.py tests/test_decision_curve_dcurves_parity.py
      - name: Commit renderer dispatch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/rtichoke/_renderers.py
          git diff --cached --quiet && exit 0
          git commit -m "Dispatch Decision Curve browser renderer"
          git push origin HEAD:feat/static-decision-curve-browser

# temporary rerun after floating-point assertion fix
