name: Temporary vendor rtichoke_viz v0.5.0

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-vendor-viz-050.yml
      - src/rtichoke/_report_browser.py

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/browser-report-viz-0.5.0
      - name: Download and inspect immutable release
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/uriahf/rtichoke_viz/releases/download/v0.5.0/rtichoke-viz-0.5.0.tar.gz'
          recorded='eafb33b50277605e5012a6289cd280b7e5f232ecccd462a94581113818678401'
          curl -fL "$url" -o /tmp/rtichoke-viz-0.5.0.tar.gz
          actual="$(sha256sum /tmp/rtichoke-viz-0.5.0.tar.gz | cut -d' ' -f1)"
          echo "recorded_sha256=$recorded"
          echo "actual_sha256=$actual"
          test "$actual" = "$recorded"
