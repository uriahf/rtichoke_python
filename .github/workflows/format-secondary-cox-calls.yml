name: Format secondary Cox call sites

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-lifelines

      - name: Normalize direct calls
        shell: python {0}
        run: |
          from pathlib import Path
          import re

          path = Path("src/rtichoke/calibration/calibration.py")
          text = path.read_text()
          pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)smooth_data = calculate_secondary_cox_smooth\(\s*"
              r"df_adj,\s*horizon,\s*performance_type,\s*"
              r"aj_risk_at_horizon=_aj_risk_at_horizon,\s*\)"
          )

          def repl(match):
              indent = match.group("indent")
              inner = indent + "    "
              return (
                  f"{indent}smooth_data = calculate_secondary_cox_smooth(\n"
                  f"{inner}df_adj,\n"
                  f"{inner}horizon,\n"
                  f"{inner}performance_type,\n"
                  f"{inner}aj_risk_at_horizon=_aj_risk_at_horizon,\n"
                  f"{indent})"
              )

          text, count = pattern.subn(repl, text)
          if count != 2:
              raise RuntimeError(f"Expected two direct secondary-Cox calls, found {count}")
          path.write_text(text)

      - name: Check syntax
        run: python -m compileall src/rtichoke/calibration

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-secondary-cox-calls.yml
          git add src/rtichoke/calibration/calibration.py
          git commit -m "Format smoothstate calibration calls"
          git push origin HEAD:agent/remove-legacy-lifelines
