name: Agent validate static IA adoption

on:
  push:
    branches:
      - feat/static-interventions-avoided-browser
    paths:
      - .github/workflows/agent-vendor-v070.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/static-interventions-avoided-browser
      - name: Verify published checksum and release provenance
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          curl -fL https://github.com/uriahf/rtichoke_viz/releases/download/v0.7.0/rtichoke-viz-0.7.0.tar.gz -o rtichoke-viz-0.7.0.tar.gz
          curl -fL https://github.com/uriahf/rtichoke_viz/releases/download/v0.7.0/rtichoke-viz-0.7.0.tar.gz.sha256 -o rtichoke-viz-0.7.0.tar.gz.sha256
          sha256sum -c rtichoke-viz-0.7.0.tar.gz.sha256
          test "$(sha256sum rtichoke-viz-0.7.0.tar.gz | awk '{print $1}')" = "f09c30e231a8be39c2e89ba6ae39c90ed8cab67021213e17681a475066a9806e"
          mkdir release
          tar -xzf rtichoke-viz-0.7.0.tar.gz -C release
          root=release/rtichoke-viz-0.7.0
          grep -Fx 'version=0.7.0' "$root/MANIFEST"
          grep -Fx 'commit=b3564d2824ec1791f791fda406c99b3d7865a68f' "$root/MANIFEST"
          grep -F 'InterventionsAvoidedV2SpecSchema' "$root/rtichoke-viz.js"
          grep -F 'renderInterventionsAvoidedV2' "$root/rtichoke-viz.js"
          grep -F 'renderDecisionCurveV2' "$root/rtichoke-viz.js"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: uv sync --all-extras --dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check src/rtichoke
      - name: Focused regressions
        run: >-
          uv run pytest
          tests/test_interventions_avoided_v2.py
          tests/test_interventions_avoided_scaling.py
          tests/test_decision_curve_v2.py
          tests/test_decision_curve_cutoff_boundary.py
          tests/test_rtichoke_viz_vendor.py
      - name: Full test suite
        run: uv run pytest tests
      - name: Install Playwright Chromium
        run: uv run --with playwright playwright install chromium
      - name: Real-browser Decision Curve acceptance
        run: uv run --with playwright pytest tests/test_decision_curve_browser_acceptance.py
