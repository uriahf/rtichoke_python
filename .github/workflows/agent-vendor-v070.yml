name: Agent format static IA adoption

on:
  push:
    branches:
      - feat/static-interventions-avoided-browser
    paths:
      - .github/workflows/agent-vendor-v070.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/static-interventions-avoided-browser
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - name: Apply repository formatter
        run: uv run ruff format src/rtichoke/_interventions_avoided_viz_spec_v2.py tests/test_interventions_avoided_v2.py
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/rtichoke/_interventions_avoided_viz_spec_v2.py tests/test_interventions_avoided_v2.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Interventions Avoided browser changes"
          git push origin HEAD:feat/static-interventions-avoided-browser
