display_name: rtichoke
parser: numpy
repo: https://github.com/uriahf/rtichoke_python
user_guide: user_guide
homepage: user_guide
site_url: https://uriahf.github.io/rtichoke_python/
include_in_header:
  - text: |
      <script>
      document.addEventListener('DOMContentLoaded', () => {
        const marker = '/examples/';
        const path = window.location.pathname;
        const pos = path.indexOf(marker);
        if (pos === -1) return;

        document.documentElement.classList.add('rtichoke-blog-shell');

        const examplesRoot = path.slice(0, pos) + '/examples/';
        const nav = document.querySelector('nav.navbar');
        if (!nav) return;

        const container = nav.querySelector('.navbar-container');
        if (!container) return;

        container.innerHTML = `
          <div class="navbar-brand-container mx-auto">
            <a class="navbar-brand" href="https://rtichoke-blog.netlify.app/" aria-label="rtichoke blog home">
              <span class="navbar-title">rtichoke blog</span>
            </a>
          </div>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarCollapse">
            <ul class="navbar-nav navbar-nav-scroll ms-auto">
              <li class="nav-item"><a class="nav-link" href="https://rtichoke-blog.netlify.app/posts"><span class="menu-text">R examples</span></a></li>
              <li class="nav-item"><a class="nav-link active" href="${examplesRoot}" aria-current="page"><span class="menu-text">Python examples</span></a></li>
              <li class="nav-item"><a class="nav-link" href="https://rtichoke-blog.netlify.app/talks.qmd"><span class="menu-text">Talks</span></a></li>
              <li class="nav-item"><a class="nav-link" href="https://rtichoke-blog.netlify.app/about_me"><span class="menu-text">About Me</span></a></li>
              <li class="nav-item compact"><a class="nav-link" href="https://github.com/uriahf" aria-label="GitHub"><i class="bi bi-github"></i></a></li>
              <li class="nav-item compact"><a class="nav-link" href="https://twitter.com/finkeluriah" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a></li>
              <li class="nav-item compact"><a class="nav-link" href="https://www.facebook.com/groups/rforthemasses" aria-label="Facebook"><i class="bi bi-facebook"></i></a></li>
              <li class="nav-item compact"><a class="nav-link" href="https://www.linkedin.com/in/uriah-finkel" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a></li>
              <li class="nav-item compact"><a class="nav-link" href="https://t.me/as_if_uriah" aria-label="Telegram"><i class="bi bi-telegram"></i></a></li>
              <li class="nav-item compact"><a class="nav-link" href="https://rtichoke-blog.netlify.app/posts.xml" aria-label="RSS"><i class="bi bi-rss"></i></a></li>
            </ul>
          </div>`;
      });
      </script>

site:
  css: site.css

sections:
  - title: Examples
    dir: examples
    type: blog
    navbar_after: User Guide

source:
  enabled: true
  branch: main
  placement: usage

reference:
  - title: Performance Data
    desc: Prepare classification and time-to-event data for visualization.
    contents:
      - prepare_performance_data
      - prepare_binned_classification_data
      - prepare_performance_data_times
      - prepare_binned_classification_data_times

  - title: Discrimination
    desc: ROC, precision-recall, gains, and lift visualizations.
    contents:
      - create_roc_curve
      - create_roc_curve_times
      - plot_roc_curve
      - create_precision_recall_curve
      - create_precision_recall_curve_times
      - plot_precision_recall_curve
      - create_gains_curve
      - create_gains_curve_times
      - plot_gains_curve
      - create_lift_curve
      - create_lift_curve_times
      - plot_lift_curve

  - title: Calibration
    desc: Calibration visualizations for classification and time-to-event models.
    contents:
      - create_calibration_curve
      - create_calibration_curve_times

  - title: Utility
    desc: Decision-curve analysis for classification and time-to-event models.
    contents:
      - create_decision_curve
      - create_decision_curve_times
      - plot_decision_curve
