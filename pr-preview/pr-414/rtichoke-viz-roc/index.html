<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rtichoke_viz ROC vendoring proof</title>
  <link rel="stylesheet" href="./rtichoke-viz.css">
</head>
<body>
  <div id="roc-chart" class="rtichoke-viz-chart"></div>
  <script id="roc-spec" type="application/json">{"schemaVersion": "1.0", "type": "roc", "data": [{"model": "Model A", "cutoff": 0.0, "sensitivity": 1.0, "specificity": 0.0}, {"model": "Model A", "cutoff": 0.1, "sensitivity": 1.0, "specificity": 0.5}, {"model": "Model A", "cutoff": 0.2, "sensitivity": 1.0, "specificity": 0.75}, {"model": "Model A", "cutoff": 0.3, "sensitivity": 1.0, "specificity": 0.75}, {"model": "Model A", "cutoff": 0.4, "sensitivity": 0.75, "specificity": 0.75}, {"model": "Model A", "cutoff": 0.5, "sensitivity": 0.75, "specificity": 0.75}, {"model": "Model A", "cutoff": 0.6, "sensitivity": 0.75, "specificity": 1.0}, {"model": "Model A", "cutoff": 0.7, "sensitivity": 0.5, "specificity": 1.0}, {"model": "Model A", "cutoff": 0.8, "sensitivity": 0.5, "specificity": 1.0}, {"model": "Model A", "cutoff": 0.9, "sensitivity": 0.25, "specificity": 1.0}, {"model": "Model A", "cutoff": 1.0, "sensitivity": 0.0, "specificity": 1.0}], "x": "false_positive_rate", "y": "sensitivity", "xAxis": {"label": "1 - Specificity", "domain": [0, 1]}, "yAxis": {"label": "Sensitivity", "domain": [0, 1]}, "references": [{"type": "identity"}]}</script>
  <script type="module">
    import { renderRoc } from "./rtichoke-viz.js";
    const spec = JSON.parse(document.querySelector("#roc-spec").textContent);
    document.querySelector("#roc-chart").append(renderRoc(spec));
  </script>
</body>
</html>
