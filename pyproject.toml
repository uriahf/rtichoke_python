[project]
authors = [
    {name = "Uriah Finkel"},
]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "plotly>=6.0.0,<7.0.0",
    "polarstate==0.1.8",
    "smoothstate>=0.1.1",
    "polars>=1.31.0",
    "reactable>=0.1.5",
    "great-tables>=0.18.0",
    "scikit-learn>=1.6.1",
]
name = "rtichoke"
version = "0.1.36"
description = "interactive visualizations for performance of predictive models"
readme = "README.md"
keywords = [
    "prediction",
    "model-performance",
    "calibration",
    "roc",
    "survival-analysis",
    "competing-risks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
matplotlib = ["matplotlib>=3.9.0"]

[project.urls]
Documentation = "https://uriahf.github.io/rtichoke_python/"
"Python Tutorials" = "https://uriahf.github.io/rtichoke_blog_python/"
"R Package" = "https://github.com/uriahf/rtichoke"
"R Tutorials" = "https://rtichoke-blog.netlify.app/posts"
Source = "https://github.com/uriahf/rtichoke_python"
Issues = "https://github.com/uriahf/rtichoke_python/issues"
Changelog = "https://github.com/uriahf/rtichoke_python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "jupyter<2.0.0,>=1.0.0",
    "pytest-cov<5.0.0,>=4.0.0",
    "pytest<8.0.0,>=7.3.0",
    "ruff>=0.11.0",
    "ipykernel>=6.29.5",
    "lifelines>=0.30.0",
    "uv>=0.6.11",
    "marimo>=0.14.7",
    "pre-commit>=4.2.0",
    "dcurves>=1.1.5",
    "ty>=0.0.1a12",
]
docs = [
    "great-docs==0.15.0",
]

[tool.uv.workspace]
members = ["rtichoke"]

[tool.uv.dependency-groups]
docs = {requires-python = ">=3.12"}

[build-system]
requires = ["uv_build>=0.7.20,<0.8.0"]
build-backend = "uv_build"
